# Durcissement du service, à part pour pouvoir l'enlever si un conteneur
# refuse une option (install.sh le retire tout seul si dashu ne démarre pas).
# En écriture : la base, et le dossier des fichiers. Le « - » tolère que ce
# dossier n'existe pas (serveur sans second disque).
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/dashu -/srv/dashu/fichiers
PrivateTmp=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
LockPersonality=yes
RestrictSUIDSGID=yes
