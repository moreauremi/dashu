# Durcissement du service, à part pour pouvoir l'enlever si un conteneur
# refuse une option (install.sh le retire tout seul si dashu ne démarre pas).
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/dashu
PrivateTmp=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
LockPersonality=yes
RestrictSUIDSGID=yes
