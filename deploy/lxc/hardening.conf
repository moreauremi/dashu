# Durcissement du service, à part pour pouvoir l'enlever si un conteneur
# refuse une option (install.sh le retire tout seul si dashu ne démarre pas).
# En écriture : la base, le dossier des fichiers et le dossier de travail des
# conversions. Le « - » tolère qu'un dossier n'existe pas (serveur sans
# second disque).
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/dashu -/srv/dashu/fichiers -/srv/dashu/tmp
PrivateTmp=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
LockPersonality=yes
RestrictSUIDSGID=yes
