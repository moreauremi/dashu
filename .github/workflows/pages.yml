# Publie le dossier website/ sur GitHub Pages à chaque push sur main.
# Réglage à faire une fois : Settings > Pages > Source = « GitHub Actions ».
name: Publier dashu.dev

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages retrouve le site envoyé par upload-pages-artifact en listant
  # les fichiers du run : sans ce droit, il n'en voit aucun (« Found 0
  # artifact(s) »), ce qui fait échouer la publication depuis le 23 novembre.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
