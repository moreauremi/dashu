# Intégration continue : à chaque push, on vérifie le formatage, clippy et les
# tests, puis on construit l'image Docker et on contrôle sa taille.
name: CI

on:
  push:
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Les requêtes SQL sont vérifiées à partir du dossier .sqlx, sans base.
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      # Le service dashu du serveur tourne dans un bac à sable systemd
      # (deploy/lxc/hardening.conf) que ni Windows ni « cargo test » n'ont :
      # bit setgid refusé, un point de montage par ReadWritePaths. La
      # compression y échouait alors que tous les tests passaient. On rejoue
      # ces options pour le test qui prépare une tâche et range son résultat.
      - name: Compression dans le bac à sable du serveur
        run: |
          sudo install -d -m 2777 /srv/dashu/tmp/jobs
          sudo install -d -m 0777 /srv/dashu/fichiers
          test_bin=$(cargo test --locked --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and (.target.kind | index("lib"))) | .executable')
          sudo systemd-run --wait --pipe --collect \
            -p ProtectSystem=strict \
            -p ReadWritePaths=/srv/dashu/fichiers \
            -p ReadWritePaths=/srv/dashu/tmp \
            -p RestrictSUIDSGID=yes \
            -p NoNewPrivileges=yes \
            "$test_bin" --ignored --exact tools::tests::bac_a_sable_du_serveur \
            | tee sandbox.log
          grep -q "test result: ok. 1 passed" sandbox.log

  docker:
    name: image Docker
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dashu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Taille de l'image (cible de la spec, moins de 30 Mo)
        run: |
          size=$(docker image inspect dashu:ci --format '{{.Size}}')
          echo "Image : $((size / 1024 / 1024)) Mo ($size octets)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -lt $((30 * 1024 * 1024))
      - name: L'image démarre et répond sur /health
        run: |
          docker run -d --name dashu --read-only \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e ALLOWED_EMAILS=ci@example.test \
            -e BASE_URL=http://localhost:3000 \
            -p 3000:3000 dashu:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health | grep -qx ok
          curl -fsS -o /dev/null http://localhost:3000/login
          docker logs dashu
