# Intégration continue : à chaque push, on vérifie le formatage, clippy et les
# tests, puis on construit l'image Docker et on contrôle sa taille.
name: CI

on:
  push:
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Les requêtes SQL sont vérifiées à partir du dossier .sqlx, sans base.
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  docker:
    name: image Docker
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dashu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Taille de l'image (cible de la spec, moins de 30 Mo)
        run: |
          size=$(docker image inspect dashu:ci --format '{{.Size}}')
          echo "Image : $((size / 1024 / 1024)) Mo ($size octets)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -lt $((30 * 1024 * 1024))
      - name: L'image démarre et répond sur /health
        run: |
          docker run -d --name dashu --read-only \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e ALLOWED_EMAILS=ci@example.test \
            -e BASE_URL=http://localhost:3000 \
            -p 3000:3000 dashu:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health | grep -qx ok
          curl -fsS -o /dev/null http://localhost:3000/login
          docker logs dashu
